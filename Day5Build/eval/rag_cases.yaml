- id: R10
  category: rule_plus_db
  tier: B
  q: Was PO-2022 a contractual breach, and does it trigger a supplier review of Finca La Esperanza?
  expected_pass_from: V5
  truth: 'Yes, a breach: actual lead time exceeds the 42-day target by more than the ±7 tolerance,
    and port congestion at Cartagena is excluded from force majeure for SUP-01, so it is not
    relieved. No review is triggered by breach count on the records available: Finca is sole-source,
    which needs two breaches in a rolling twelve months, and the database shows one -- the
    step is written notice (step 1).'
  sources:
  - doc: MR-PROC-HB-003
    version: '3.0'
    section: '3.1'
    page: 2
    quote: Tolerance | ± 7 days
  - doc: MR-PROC-HB-003
    version: '3.0'
    section: '4.2'
    page: 5
    quote: Variance is actual lead time minus contracted target.
  - doc: MR-PROC-HB-003
    version: '3.0'
    section: '9.2'
    page: 7
    quote: a breach, not a relieved event
  - doc: MR-PROC-HB-003
    version: '3.0'
    section: '11.1'
    page: 8
    quote: review is triggered by two breaches within a rolling twelve months, rather than
      three
  - doc: MR-PROC-HB-003
    version: '3.0'
    section: '10'
    page: 8
    quote: First breach in rolling 12 months | Written notice, recorded on supplier record
  facts:
  - name: po_2022
    sql: |
      SELECT po.purchase_order_id, s.supplier_name, po.po_date, po.actual_arrival,
             CAST(julianday(po.actual_arrival) - julianday(po.po_date) AS INTEGER) AS actual_days,
             s.lead_time_days_target AS target_days,
             CAST(julianday(po.actual_arrival) - julianday(po.po_date) AS INTEGER)
               - s.lead_time_days_target AS variance_days,
             ib.delay_reason
      FROM purchase_orders po JOIN suppliers s ON s.supplier_id = po.supplier_id
      LEFT JOIN inbound_shipments ib ON ib.purchase_order_id = po.purchase_order_id
      WHERE po.purchase_order_id = 'PO-2022'
    shape: row
    value:
      purchase_order_id: PO-2022
      supplier_name: Finca La Esperanza
      po_date: '2025-12-10'
      actual_arrival: '2026-02-16'
      actual_days: 68
      target_days: 42
      variance_days: 26
      delay_reason: Port congestion at Cartagena; vessel roll-over (2 sailings missed)
  - name: finca_breaches_last_12_months
    sql: |
      SELECT po.purchase_order_id,
             CAST(julianday(po.actual_arrival) - julianday(po.po_date) AS INTEGER)
               - s.lead_time_days_target AS variance_days
      FROM purchase_orders po JOIN suppliers s ON s.supplier_id = po.supplier_id
      WHERE s.supplier_id = 'SUP-01' AND po.actual_arrival IS NOT NULL
        AND date(po.actual_arrival) >= date(:as_of, '-12 months')
        AND julianday(po.actual_arrival) - julianday(po.po_date) - s.lead_time_days_target > 7
    shape: rows
    value:
    - purchase_order_id: PO-2022
      variance_days: 26
  must_retrieve:
  - doc: MR-PROC-HB-003
    section: '3.1'
  - doc: MR-PROC-HB-003
    section: '9.2'
  - doc: MR-PROC-HB-003
    section: '11.1'
  must_not_retrieve:
  - doc: MR-PROC-HB-003
    section: '11.2'
  requires_docs:
  - MR-PROC-HB-003
  requires_db: true
  scoring: scored
  trap: '11.2 (multi-source) is the near-miss: "any single breach exceeding thirty days''
    variance" does not apply to a sole-source supplier, and the variance is under thirty anyway.
    Also: the variance matches the 4.3 worked example exactly; quoting the example is not
    the same as computing from the record.'
  assertions:
  - computes the variance from facts.po_2022 (actual minus target) and compares it to the
    ±7 tolerance
  - says the delay is not relieved, because Cartagena port congestion is carved out under
    9.2
  - says a review is not yet triggered -- one breach in facts.finca_breaches_last_12_months
    against a sole-source threshold of two -- and names written notice as the step
  - notes that breaches before the database window are not visible, rather than asserting
    there were none
  check:
  - llm_judge
  - citation_matches_source
  failure_watch:
  - partial_conditions
  - near_miss
- id: R11
  category: rule_plus_db
  tier: B
  q: Did the February Cascadia substitution require us to notify customers?
  expected_pass_from: V5
  truth: Yes. Score delta is measured against the specification minimum (84.0); the substitute
    lot's score gives a delta above 2.0, which makes notification mandatory before or with
    despatch, to every customer whose order contains an affected batch, wholesale included.
  sources:
  - doc: MR-QA-STD-002
    version: '2.3'
    section: '5.3'
    page: 4
    quote: It is calculated against the specification minimum, not against the score of the
      lot that happened to be in use last week.
  - doc: MR-QA-STD-002
    version: '2.3'
    section: '5.4'
    page: 4
    quote: Where a substitution produces a score delta greater than 2.0 points against specification,
      affected customers must be notified before or with despatch.
  - doc: MR-QA-STD-002
    version: '2.3'
    section: '3.1'
    page: 2
    quote: Minimum cupping score, base component | 84.0
  facts:
  - name: substitute_lot
    sql: |
      SELECT DISTINCT gl.lot_id, gl.origin, gl.cupping_score,
             ROUND(84.0 - gl.cupping_score, 1) AS delta_vs_spec_minimum
      FROM roast_batches rb JOIN green_lots gl ON gl.lot_id = rb.lot_id
      JOIN products p ON p.product_id = rb.product_id
      WHERE p.name = 'Cascadia Blend' AND rb.qa_note LIKE '%ubstitut%'
    shape: rows
    value:
    - lot_id: LOT-BR-0118
      origin: Brazil
      cupping_score: 79.5
      delta_vs_spec_minimum: 4.5
  - name: qa_notes
    sql: |
      SELECT DISTINCT qa_note FROM roast_batches WHERE qa_note LIKE '%ubstitut%'
    shape: column
    value:
    - Substitute origin used -- Colombian lot unavailable (PO-2043 delayed). Cup profile flatter
      than spec.
  must_retrieve:
  - doc: MR-QA-STD-002
    section: '5.3'
  - doc: MR-QA-STD-002
    section: '5.4'
  must_not_retrieve: []
  requires_docs:
  - MR-QA-STD-002
  requires_db: true
  scoring: scored
  assertions:
  - computes the delta from the lot score in facts.substitute_lot against the 84.0 specification
    minimum
  - concludes notification was required (delta above 2.0)
  - says it applies to wholesale accounts as well as D2C
  - notes the batch QA note (facts.qa_notes) records neither authority, delta nor notification
    status, which 5.5 requires
  check:
  - llm_judge
  - citation_matches_source
  failure_watch:
  - retrieval
  - ungrounded
- id: R12
  category: rule_plus_db
  tier: A
  q: How many customers should have received a substitution notice for the February Cascadia
    batches?
  expected_pass_from: V5
  why_rung: The rule (who must be notified) is in QA 5.4; the count is only in the database.
    Neither source answers alone.
  truth_sql: |
    SELECT COUNT(DISTINCT so.customer_id)
    FROM sales_order_lines l
    JOIN roast_batches rb ON rb.batch_id = l.batch_id
    JOIN products p ON p.product_id = rb.product_id
    JOIN sales_orders so ON so.sales_order_id = l.sales_order_id
    WHERE p.name = 'Cascadia Blend' AND rb.qa_note LIKE '%ubstitut%'
  truth_shape: scalar
  truth: 38
  source:
    doc: MR-QA-STD-002
    version: '2.3'
    section: '5.4'
    page: 4
    quote: be issued to every customer whose order contains the affected batch, including
      wholesale accounts
  facts:
  - name: wholesale_accounts_affected
    sql: |
      SELECT COUNT(DISTINCT so.account_id)
      FROM sales_order_lines l
      JOIN roast_batches rb ON rb.batch_id = l.batch_id
      JOIN products p ON p.product_id = rb.product_id
      JOIN sales_orders so ON so.sales_order_id = l.sales_order_id
      WHERE p.name = 'Cascadia Blend' AND rb.qa_note LIKE '%ubstitut%' AND so.account_id IS NOT NULL
    shape: scalar
    value: 6
  naive:
  - label: only customers who complained
    sql: |
      SELECT COUNT(DISTINCT customer_id) FROM tickets WHERE category = 'quality' AND sales_order_id IN (
        SELECT l.sales_order_id FROM sales_order_lines l
        JOIN roast_batches rb ON rb.batch_id = l.batch_id WHERE rb.qa_note LIKE '%ubstitut%')
    shape: scalar
    value: 14
  - label: D2C only (wholesale left out)
    sql: |
      SELECT COUNT(DISTINCT so.customer_id)
      FROM sales_order_lines l
      JOIN roast_batches rb ON rb.batch_id = l.batch_id
      JOIN products p ON p.product_id = rb.product_id
      JOIN sales_orders so ON so.sales_order_id = l.sales_order_id
      WHERE p.name = 'Cascadia Blend' AND rb.qa_note LIKE '%ubstitut%' AND so.channel = 'd2c'
    shape: scalar
    value: 32
  must_retrieve:
  - doc: MR-QA-STD-002
    section: '5.4'
  must_not_retrieve: []
  requires_docs:
  - MR-QA-STD-002
  requires_db: true
  scoring: scored
  check:
  - answer_contains_number
  - answer_excludes_naive
  - citation_matches_source
  failure_watch:
  - retrieval
  - ungrounded
- id: R13
  category: rule_plus_db
  tier: B
  q: What's the most we could offer Rosewood for the February quality problem, and who would
    have to approve it?
  expected_pass_from: V5
  truth: 'USD 1,250 (flagship, uplifted because the affected orders contain substituted batches
    -- company-attributable). Up to 1,250 needs the Director of Customer Experience, or a
    CX supervisor with written Finance concurrence. Rosewood is billed in CAD: convert at
    the incident-date rate before comparing to the cap.'
  sources:
  - doc: MR-CC-POL-004
    version: '4.0'
    section: '7.3'
    page: 5
    quote: Wholesale flagship | 500 | 1,250
  - doc: MR-CC-POL-004
    version: '4.0'
    section: '6'
    page: 4
    quote: 501 to 1,250 | Director of Customer Experience, or CX supervisor with written Finance
      concurrence
  - doc: MR-CC-POL-004
    version: '4.0'
    section: '8'
    page: 6
    quote: Use the rate published for the incident date, not the rate on the day the decision
      is taken
  facts:
