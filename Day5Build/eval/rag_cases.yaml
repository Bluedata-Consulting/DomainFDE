# GENERATED FIELDS: truth, expect_all, naive[].value, alt[].value, facts[].value
# are written by eval/derive_truth.py from the SQL stored beside them. Do not
# edit them by hand -- edit the SQL and re-run the script. Everything else in
# this file is hand-authored. See meta.* for the vocabulary used below.

meta:
  dataset: meridian-agent-ladder
  file: rag_cases.yaml
  rungs_covered: V5
  as_of: '2026-03-16'
  database: data/roastery.db
  corpus: data/EnterpriseKnoweledge/*.pdf
  derived_by: eval/derive_truth.py
  provenance: Every rule was read off the cited PDF page (the PDFs have no text layer; pages
    were checked as rendered images and the quotes are re-verified against the page transcription
    on every run). Every database fact is the result of the SQL stored beside it. No agent,
    prompt or tool source was read.
  fields:
    must_retrieve: '[{doc, section}] passages that MUST appear in the retrieved set'
    must_not_retrieve: '[{doc, section}] superseded or near-miss passages; retrieving one
      is not a failure by itself, USING it is'
    requires_docs: document codes the answer needs; more than one means cross-document
    requires_db: true when a database fact is needed as well as a rule
    scoring: scored (partial credit per assertion) or pass_fail (adversarial)
  section_ids: 'Sections are named as in the documents: ''7.3'', ''Appendix B''. The post-mortem
    archive is sectioned by incident id (''INC-2024-11''); its consolidated open-items table
    sits at the end of the ''INC-2025-12'' section.'
  failure_classes:
    retrieval: a required passage not retrieved
    superseded: a no-longer-in-force rule applied
    citation: a rule stated without, or with the wrong, source
    ungrounded: an answer the retrieved text does not support (including out-of-corpus invention)
    near_miss: a rule applied outside its stated scope
    partial_conditions: a multi-condition clause applied when only some conditions hold
    currency: currencies compared or summed without conversion
    authority: approval requirements omitted or misstated
