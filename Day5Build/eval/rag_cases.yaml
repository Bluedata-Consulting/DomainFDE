- id: R19
  category: adversarial_near_miss
  tier: B
  q: Kochere's last container was held up by port congestion in Djibouti. That's a breach
    under the port-congestion carve-out, right?
  expected_pass_from: V5
  truth: No. The 9.2 carve-out applies to SUP-01 and SUP-04 only; Kochere is standard 9.1,
    no carve-out. Whether a delay is a breach depends on variance against its ±10 tolerance
    and on whether force majeure relief was properly claimed -- and no Kochere purchase order
    in the database is outside tolerance.
  sources:
  - doc: MR-PROC-HB-003
    version: '3.0'
    section: '9.2'
    page: 7
    quote: Applies to Finca La Esperanza (SUP-01) and Lintong Highlands (SUP-04) only.
  - doc: MR-PROC-HB-003
    version: '3.0'
    section: '3.2'
    page: 3
    quote: Force majeure | §9.1, standard, no carve-out
  facts:
  - name: kochere_worst_variance
    sql: |
      SELECT MAX(CAST(julianday(po.actual_arrival) - julianday(po.po_date) AS INTEGER)
                 - s.lead_time_days_target) AS worst_variance_days,
             COUNT(*) AS arrived_pos
      FROM purchase_orders po JOIN suppliers s ON s.supplier_id = po.supplier_id
      WHERE s.supplier_name = 'Kochere Cooperative' AND po.actual_arrival IS NOT NULL
    shape: row
    value:
      worst_variance_days: 1
      arrived_pos: 6
  - name: kochere_delay_reasons
    sql: |
      SELECT COUNT(*) FROM inbound_shipments ib
      JOIN purchase_orders po ON po.purchase_order_id = ib.purchase_order_id
      WHERE po.supplier_id = 'SUP-02' AND ib.delay_reason IS NOT NULL
    shape: scalar
    value: 0
  must_retrieve:
  - doc: MR-PROC-HB-003
    section: '9.2'
  - doc: MR-PROC-HB-003
    section: '3.2'
  must_not_retrieve: []
  requires_docs:
  - MR-PROC-HB-003
  requires_db: true
  scoring: pass_fail
  pass_when: Says the carve-out does not apply to Kochere and that breach turns on variance
    against ±10 days and 9.1 relief; does not confirm the premise.
  fail_when: agrees it is a breach under the carve-out
  check:
  - pass_fail
  failure_watch:
  - near_miss
- id: R20
  category: adversarial_partial_conditions
  tier: B
  q: Can we offer Rosewood a Relationship Recovery Allowance?
  expected_pass_from: V5
  truth: 'Not on the current record. 7.4 needs all three: (1) company-attributable or mixed
    -- met, the orders contain substituted batches; (2) two or more separate incidents in
    a rolling sixty days -- arguable on the record; (3) a written or recorded intention to
    review, reduce or terminate the relationship -- not met: the ticket messages complain
    but do not say so. Without (3) no RRA; the uplifted flagship cap under 7.3 still applies.'
  sources:
  - doc: MR-CC-POL-004
    version: '4.0'
    section: '7.4'
    page: 5
    quote: For flagship wholesale accounts where all of the following hold
  - doc: MR-CC-POL-004
    version: '4.0'
    section: '7.4'
    page: 6
    quote: the account has expressed, in writing or on a recorded call, an intention to review,
      reduce or terminate the relationship
  facts:
  - name: rosewood_customer_messages
    sql: |
      SELECT t.ticket_id, t.status, m.sent_at, m.body
      FROM ticket_messages m JOIN tickets t ON t.ticket_id = m.ticket_id
      JOIN customers c ON c.customer_id = t.customer_id
      JOIN wholesale_accounts a ON a.account_id = c.account_id
      WHERE a.account_name = 'Rosewood Coffee House' AND m.author = 'customer'
      ORDER BY m.sent_at
    shape: rows
    value:
    - ticket_id: TKT-00281
      status: resolved
      sent_at: '2026-02-24 09:00:00'
      body: We have had complaints two weeks running. This is affecting our bar.
    - ticket_id: TKT-00282
      status: resolved
      sent_at: '2026-03-02 09:00:00'
      body: We have had complaints two weeks running. This is affecting our bar.
    - ticket_id: TKT-00012
      status: resolved
      sent_at: '2026-03-07 09:00:00'
      body: We have had complaints from our customers about the espresso this month.
    - ticket_id: TKT-00283
      status: escalated
      sent_at: '2026-03-08 09:00:00'
      body: We have had complaints two weeks running. This is affecting our bar.
  - name: substituted_orders
    sql: |
      SELECT DISTINCT so.sales_order_id FROM sales_orders so
      JOIN wholesale_accounts a ON a.account_id = so.account_id
      JOIN sales_order_lines l ON l.sales_order_id = so.sales_order_id
      JOIN roast_batches rb ON rb.batch_id = l.batch_id
      WHERE a.account_name = 'Rosewood Coffee House' AND rb.qa_note LIKE '%ubstitut%'
    shape: column
    value:
    - SO-08170
    - SO-08202
  must_retrieve:
  - doc: MR-CC-POL-004
    section: '7.4'
  must_not_retrieve: []
  requires_docs:
  - MR-CC-POL-004
  requires_db: true
  scoring: pass_fail
  pass_when: Walks all three conditions, finds (3) unmet on the written record (facts.rosewood_customer_messages),
    and does not offer an RRA -- while noting the uplifted cap still applies.
  fail_when: Offers or recommends an RRA, or treats the escalation itself (or the case brief's
    "hinting at leaving") as the written intention the clause requires.
  check:
  - pass_fail
  failure_watch:
  - partial_conditions
