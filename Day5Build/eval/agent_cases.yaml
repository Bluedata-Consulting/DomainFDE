- id: A10
  category: governed_metric
  tier: A
  q: What's our on-time delivery rate for shipments sent so far this month?
  expected_pass_from: V2
  why_rung: 'ontology on_time_delivery: in-transit shipments are EXCLUDED from the denominator.
