- id: A06
  category: multi_hop
  tier: A
  q: Trace the most recent Cascadia Blend order back to the supplier.
  expected_pass_from: V1
  why_rung: Six hops (order -> line -> batch -> lot -> purchase order -> supplier), crossing
    from CXM to SCM at the batch->lot join. V0 tends to stop at the batch and call it done.
  truth_sql: |
    SELECT so.sales_order_id, so.order_date, l.batch_id, rb.lot_id,
           gl.origin AS lot_origin, gl.purchase_order_id, s.supplier_id, s.supplier_name
    FROM sales_orders so
    JOIN sales_order_lines l ON l.sales_order_id = so.sales_order_id
    JOIN products p ON p.product_id = l.product_id AND p.name = 'Cascadia Blend'
    LEFT JOIN roast_batches rb ON rb.batch_id = l.batch_id
    LEFT JOIN green_lots gl ON gl.lot_id = rb.lot_id
    LEFT JOIN purchase_orders po ON po.purchase_order_id = gl.purchase_order_id
    LEFT JOIN suppliers s ON s.supplier_id = po.supplier_id
    ORDER BY so.order_date DESC, so.sales_order_id DESC LIMIT 1
  truth_shape: row
  truth:
    sales_order_id: SO-08460
    order_date: '2026-03-16'
    batch_id: BAT-5426
    lot_id: LOT-CO-0106
    lot_origin: Colombia
    purchase_order_id: PO-2006
    supplier_id: SUP-01
    supplier_name: Finca La Esperanza
  expect_all_from:
  - sales_order_id
  - batch_id
  - lot_id
  - purchase_order_id
  - supplier_name
  trap: Stopping at the batch; treating batch and lot as synonyms; or naming the supplier
    from the product's usual origin instead of walking the join.
  check:
  - answer_contains_all
  failure_watch:
  - loop
  - multi_hop
  expect_all:
  - SO-08460
  - BAT-5426
  - LOT-CO-0106
  - PO-2006
  - Finca La Esperanza
- id: A07
  category: multi_hop
  tier: A
  q: Compare February on-time delivery in the Northeast against the rest of the US.
  expected_pass_from: V1
  why_rung: Two parallel gathers and a comparison. V0 fetches one side and describes it. Northeast
    = US Census Northeast (CT ME MA NH NJ NY PA RI VT); only CT, MA and NY occur in the data.
  truth_sql: |
    SELECT CASE WHEN so.ship_state IN ('CT','ME','MA','NH','NJ','NY','PA','RI','VT')
                THEN 'Northeast' ELSE 'Rest of US' END AS region,
           COUNT(*) AS delivered,
           SUM(date(sh.delivered_at) <= date(sh.promised_at)) AS on_time,
           ROUND(100.0 * SUM(date(sh.delivered_at) <= date(sh.promised_at)) / COUNT(*), 1)
             AS on_time_pct
    FROM shipments sh JOIN sales_orders so ON so.sales_order_id = sh.sales_order_id
    WHERE so.ship_country = 'US' AND sh.delivered_at IS NOT NULL
      AND sh.promised_at LIKE '2026-02%'
    GROUP BY region ORDER BY region
  truth_shape: rows
  truth:
  - region: Northeast
    delivered: 73
    on_time: 47
    on_time_pct: 64.4
  - region: Rest of US
    delivered: 184
    on_time: 155
    on_time_pct: 84.2
  score_field: on_time_pct
  tolerance: 2.0
  alt:
  - label: February by ship date rather than promise date (within tolerance)
    sql: |
      SELECT CASE WHEN so.ship_state IN ('CT','ME','MA','NH','NJ','NY','PA','RI','VT')
                  THEN 'Northeast' ELSE 'Rest of US' END AS region,
             ROUND(100.0 * SUM(date(sh.delivered_at) <= date(sh.promised_at)) / COUNT(*), 1)
               AS on_time_pct
      FROM shipments sh JOIN sales_orders so ON so.sales_order_id = sh.sales_order_id
      WHERE so.ship_country = 'US' AND sh.delivered_at IS NOT NULL
        AND sh.shipped_at LIKE '2026-02%'
      GROUP BY region ORDER BY region
    shape: rows
    value:
    - region: Northeast
      on_time_pct: 66.2
    - region: Rest of US
      on_time_pct: 82.5
  check:
  - answer_contains_number
  failure_watch:
  - loop
  - metric
- id: C01
  category: entity_ambiguity
  tier: C
  q: What's Jane's query about?
  expected_pass_from: V2
  why_rung: 'Two ambiguities in six words: two different Janes, and "query" means a support
    ticket. V0/V1 are confident and wrong -- rewriting the loop does not change what "Jane"
    resolves to. V2''s resolver returns candidates.'
  facts:
  - name: jane_candidates
    sql: |
      SELECT 'customer' AS source, customer_id AS id,
             first_name || ' ' || last_name AS name, email, channel AS detail, account_id
      FROM customers WHERE first_name = 'Jane'
      UNION ALL
      SELECT 'wholesale_contact', contact_id, contact_name, email, role, account_id
      FROM wholesale_contacts WHERE contact_name LIKE 'Jane %'
      UNION ALL
      SELECT 'supplier_contact', contact_id, contact_name, email, role, supplier_id
      FROM supplier_contacts WHERE contact_name LIKE 'Jane %'
    shape: rows
    value:
    - source: customer
      id: CUS-0001
      name: Jane Okafor
      email: jane.okafor@example.com
      detail: d2c
      account_id: null
    - source: customer
      id: CUS-0002
      name: Jane Mensah
      email: jane@rosewoodcoffee.ca
      detail: wholesale
      account_id: ACC-001
    - source: wholesale_contact
      id: WC-001
      name: Jane Mensah
      email: jane@rosewoodcoffee.ca
      detail: Owner
      account_id: ACC-001
  - name: distinct_people
    sql: |
      SELECT COUNT(DISTINCT lower(email)) FROM (
        SELECT email FROM customers WHERE first_name = 'Jane'
        UNION ALL SELECT email FROM wholesale_contacts WHERE contact_name LIKE 'Jane %'
        UNION ALL SELECT email FROM supplier_contacts WHERE contact_name LIKE 'Jane %')
    shape: scalar
    value: 2
  - name: tickets_by_any_jane
    sql: |
      SELECT c.first_name || ' ' || c.last_name AS raised_by, t.ticket_id, t.opened_at,
             t.category, t.status, t.subject
      FROM tickets t JOIN customers c ON c.customer_id = t.customer_id
      WHERE c.first_name = 'Jane' ORDER BY t.opened_at
    shape: rows
    value:
    - raised_by: Jane Mensah
      ticket_id: TKT-00281
      opened_at: '2026-02-24 10:00:00'
      category: quality
      status: resolved
      subject: Espresso profile has changed -- customers noticing
    - raised_by: Jane Mensah
      ticket_id: TKT-00282
      opened_at: '2026-03-02 12:00:00'
      category: quality
      status: resolved
      subject: Espresso profile has changed -- customers noticing
    - raised_by: Jane Mensah
      ticket_id: TKT-00012
      opened_at: '2026-03-07 15:00:00'
      category: quality
      status: resolved
      subject: Coffee tastes flat / off-profile
    - raised_by: Jane Mensah
      ticket_id: TKT-00283
      opened_at: '2026-03-08 14:00:00'
      category: quality
      status: escalated
      subject: Espresso profile has changed -- customers noticing
  assertions:
  - surfaces that more than one person matches "Jane" (facts.distinct_people), naming both
  - does NOT proceed with a single Jane without saying so
  - treats "query" as a support ticket, not as SQL
  - does not attribute any ticket to a Jane who has none in facts.tickets_by_any_jane
  check: llm_judge
  failure_watch:
  - entity
  - tool
