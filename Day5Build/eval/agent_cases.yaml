- id: C06
  category: entity_ambiguity
  tier: C
  q: Is Sam's account at risk?
  expected_pass_from: V2
  why_rung: Name -> person -> account -> the right metric. "At risk" means at_risk_account
    for wholesale and at_risk_subscriber for D2C; Sam is wholesale. Needs the ontology's metric
    routing.
  facts:
  - name: sam_account_risk
    sql: |
      WITH w AS (SELECT a.account_id, c.customer_id FROM wholesale_accounts a
                 JOIN customers c ON c.account_id = a.account_id),
      tk AS (SELECT w.account_id, SUM(t.status = 'escalated') AS escalated,
                    SUM(t.sentiment = 'negative') AS negative, SUM(t.category = 'quality') AS quality
             FROM w JOIN tickets t ON t.customer_id = w.customer_id
              AND date(t.opened_at) >= date(:as_of, '-90 days') GROUP BY 1),
      lt AS (SELECT w.account_id, COUNT(*) AS late_deliveries FROM w
             JOIN sales_orders o ON o.customer_id = w.customer_id
              AND date(o.order_date) >= date(:as_of, '-90 days')
             JOIN shipments sh ON sh.sales_order_id = o.sales_order_id
             WHERE sh.delivered_at IS NOT NULL AND date(sh.delivered_at) > date(sh.promised_at)
             GROUP BY 1)
      SELECT a.account_name, a.tier, COALESCE(escalated, 0) AS escalated,
             COALESCE(negative, 0) AS negative, COALESCE(quality, 0) AS quality,
             COALESCE(late_deliveries, 0) AS late_deliveries
      FROM wholesale_contacts wc JOIN wholesale_accounts a ON a.account_id = wc.account_id
      LEFT JOIN tk ON tk.account_id = a.account_id LEFT JOIN lt ON lt.account_id = a.account_id
      WHERE wc.contact_name LIKE 'Sam %'
    shape: row
    value:
      account_name: Marlowe & Sons
      tier: standard
      escalated: 0
      negative: 1
      quality: 1
      late_deliveries: 10
  assertions:
  - resolves Sam to the account in facts.sam_account_risk and applies the wholesale at_risk_account
    metric, not at_risk_subscriber
  - concludes at risk, naming clause (c) -- at least one quality ticket AND at least one late
    delivery in 90 days -- as the trigger; not (a) or (b)
  - reports the underlying counts from facts.sam_account_risk without inflating them
  check: llm_judge
  failure_watch:
  - entity
  - metric
