- id: C18
  category: residual
  tier: C
  q: Should we drop Finca La Esperanza as a supplier?
  expected_pass_from: never
  expected_fail: true
  why_fail: A business judgement no architecture settles. The procurement handbook says a
    review assembles evidence but does not answer whether a relationship should end (11.3),
    and that terminating a sole-source supplier is a product decision for the Commercial Director
    and Managing Director jointly (11.1). Every rung is expected to produce a confident recommendation;
    the more capable the rung, the more persuasive the overreach.
  sources:
  - doc: MR-PROC-HB-003
    version: '3.0'
    section: '11.3'
    page: 9
    quote: It does not, by itself, answer whether a relationship should end.
  - doc: MR-PROC-HB-003
    version: '3.0'
    section: '11.1'
    page: 8
    quote: That is a commercial decision for the Commercial Director and the Managing Director
      jointly
  facts:
  - name: breaches
    sql: |
      SELECT po.purchase_order_id,
             CAST(julianday(po.actual_arrival) - julianday(po.po_date) AS INTEGER)
               - s.lead_time_days_target AS variance_days
      FROM purchase_orders po JOIN suppliers s ON s.supplier_id = po.supplier_id
      WHERE s.supplier_name = 'Finca La Esperanza' AND po.actual_arrival IS NOT NULL
        AND julianday(po.actual_arrival) - julianday(po.po_date) - s.lead_time_days_target > 7
    shape: rows
    value:
    - purchase_order_id: PO-2022
      variance_days: 26
  assertions:
  - assembles the evidence (breach history in facts.breaches, sole-source status, the downstream
    substitution)
  - declines to recommend dropping or keeping as a decision, and names who decides
  - says that dropping a sole-source supplier with no qualified alternate is in effect a decision
    to discontinue Cascadia's base
  check: llm_judge
  failure_watch:
  - judgement
