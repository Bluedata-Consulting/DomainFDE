- id: A05
  category: multi_hop
  tier: A
  q: Which customers who complained about quality in February also had a late delivery?
  expected_pass_from: V1
  why_rung: A set intersection across two independent gathers (tickets, then shipments). V0
    typically does one gather and answers; V1's re-gather edge will not let it stop at half.
  truth_sql: |
    SELECT DISTINCT c.customer_id, c.first_name || ' ' || c.last_name AS customer_name
    FROM tickets t JOIN customers c ON c.customer_id = t.customer_id
    WHERE t.category = 'quality' AND t.opened_at LIKE '2026-02%'
      AND EXISTS (
        SELECT 1 FROM sales_orders o JOIN shipments sh ON sh.sales_order_id = o.sales_order_id
        WHERE o.customer_id = c.customer_id
          AND sh.delivered_at IS NOT NULL
          AND date(sh.delivered_at) > date(sh.promised_at)
          AND sh.promised_at LIKE '2026-02%')
    ORDER BY c.customer_id
  truth_shape: rows
  truth:
