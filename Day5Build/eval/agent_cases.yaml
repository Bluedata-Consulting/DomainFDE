  truth_sql: |
    SELECT COUNT(*) AS delivered,
           SUM(date(delivered_at) <= date(promised_at)) AS on_time,
           ROUND(100.0 * SUM(date(delivered_at) <= date(promised_at)) / COUNT(*), 1)
             AS on_time_pct
