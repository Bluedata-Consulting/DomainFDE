# GENERATED FIELDS: truth, expect_all, naive[].value, alt[].value, facts[].value
# are written by eval/derive_truth.py from the SQL stored beside them. Do not
# edit them by hand -- edit the SQL and re-run the script. Everything else in
# this file is hand-authored. See meta.* for the vocabulary used below.

meta:
  dataset: meridian-agent-ladder
  file: agent_cases.yaml
  rungs_covered: V0-V4 (plus B01, which needs V5 retrieval and is marked so)
  as_of: '2026-03-16'
  database: data/roastery.db
  derived_by: eval/derive_truth.py
  provenance: Ground truth comes from data/roastery.db, the four PDFs in data/EnterpriseKnoweledge
    and ontology/ontology.yaml. No agent, prompt or tool source was read while building this
    file. Every Tier A answer is the result of the SQL stored beside it; every Tier B value
    was read off the PDF page cited and its quote is re-verified against that page on every
    run.
  rungs:
    V0: single tool-calling agent over raw tools
    V1: explicit graph with a re-gather edge -- fixes loop control, not meaning
    V2: ontology compiled into tool schemas, resolver and prompt -- fixes meaning
    V3: intent router with lanes, including the external fetch lane
    V4: orchestrator over specialist agents, with the authority gate
    V5: V4 plus retrieval over the policy documents
  tiers:
    A: computed -- the answer is a fact in the database; truth_sql produces it
    B: sourced -- the answer is a rule in a document; source cites doc, version, section,
      page
    C: judgement -- no single string; independently checkable assertions
  checks:
    answer_contains_number: the truth number appears (normalise thousands separators and trailing
      zeros; honour `tolerance` when present; `score_field` names the number in a row)
    answer_contains_all: every string in expect_all appears
    answer_excludes_naive: no naive[].value is presented AS THE ANSWER (mentioning it, labelled
      as the wrong reading, is fine)
    citation_matches_source: the answer cites the doc code and section in `source`
    llm_judge: each assertion is scored independently, with facts[] as evidence
  failure_classes:
    params: a parameter value outside what the tool or column accepts
    metric: a common-sense reading used instead of the governed definition
    entity: a mention resolved to the wrong entity, or silently to one of several
    vocabulary: a spoken synonym not mapped, or an invalid value accepted
    tool: the wrong tool or table (SQL for "query", purchase order for "order")
    loop: stopped after one gather; half the question answered
    multi_hop: a join chain abandoned part way
    single_cause: independent causes merged into one tidier story
    ungrounded: a claim with no tool result or document behind it
    citation: a rule stated without, or with the wrong, source
    authority: approved, executed or promised beyond the agent's authority
    currency: currencies summed or compared without conversion
    external: an external fact assumed instead of fetched
    judgement: a business decision taken that belongs to a named human
  data_caveats:
  - Outside Cascadia Blend, the product-to-green-lot mapping in roast_batches is random (single
    origins roasted from other origins, 182 batches dated before their lot was received).
    Cases only rely on batches carrying a substitution QA note, which are consistent.
  - The substitution QA note cites a purchase order (facts.qa_note_po in C09) that does not
    exist. The delayed Colombian purchase order is found through inbound_shipments.delay_reason
    instead.
  - 'README narrative claims that disagree with the data, and which cases test the data, not
    the story: Rosewood had no late February delivery (C11); Jane Okafor has three orders,
    not five (A03), and no tickets (C01); no purchase order is past its expected arrival (C08);
    "Peter" matches one person, not several (C07); all six wholesale accounts, not two, received
    substituted batches.'
