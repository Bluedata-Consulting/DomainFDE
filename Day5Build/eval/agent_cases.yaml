      WITH n AS (SELECT DISTINCT qa_note AS note FROM roast_batches WHERE qa_note LIKE '%PO-%')
      SELECT substr(note, instr(note, 'PO-'), 7) AS cited_po,
             (SELECT COUNT(*) FROM purchase_orders
              WHERE purchase_order_id = substr(n.note, instr(n.note, 'PO-'), 7)) AS cited_po_exists
      FROM n
    shape: rows
    value:
    - cited_po: PO-2043
      cited_po_exists: 0
  - name: quality_tickets_on_substituted_orders
    sql: |
      SELECT COUNT(*) FROM tickets WHERE category = 'quality' AND sales_order_id IN (
        SELECT l.sales_order_id FROM sales_order_lines l
        JOIN roast_batches rb ON rb.batch_id = l.batch_id WHERE rb.qa_note LIKE '%ubstitut%')
    shape: scalar
    value: 16
  assertions:
  - identifies the substitution in facts.substituted_batches (product, date range, lot) as
    the cause, with the lot's score from facts.substitute_lot
  - links it to the supply gap -- the delayed purchase order in facts.delayed_inbound, its
    supplier and delay reason
  - names the joins it walked (ticket -> order -> line -> batch -> lot, and lot/PO -> supplier)
  - does not cite the purchase order in facts.qa_note_po as real when cited_po_exists is 0
    (or flags the discrepancy)
  - does not blame the substitute lot's supplier for the delay -- the late supplier and the
    substitute lot's supplier are different
  - does not attribute the spike to delivery or weather
  check: llm_judge
  failure_watch:
  - multi_hop
  - single_cause
  - ungrounded
