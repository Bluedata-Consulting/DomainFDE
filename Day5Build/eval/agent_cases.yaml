- id: C03
  category: entity_ambiguity
  tier: C
  q: How many of Ben's February deliveries were late, and why?
  expected_pass_from: V2
  why_rung: Ben appears as a customer and as a wholesale contact. An agent that treats them
    as two people either asks a needless question or double counts; "why" needs the exception
    codes on the shipments.
  facts:
  - name: ben_records
    sql: |
      SELECT 'customer' AS source, customer_id AS id, email, account_id FROM customers
      WHERE first_name = 'Ben'
      UNION ALL
      SELECT 'wholesale_contact', contact_id, email, account_id FROM wholesale_contacts
      WHERE contact_name LIKE 'Ben %'
    shape: rows
    value:
    - source: customer
      id: CUS-0006
      email: ben@foundryworkspace.com
      account_id: ACC-005
    - source: wholesale_contact
      id: WC-006
      email: ben@foundryworkspace.com
      account_id: ACC-005
  - name: ben_late_february
    sql: |
      SELECT sh.sales_order_id, sh.promised_at, sh.delivered_at,
             CAST(julianday(sh.delivered_at) - julianday(sh.promised_at) AS INTEGER) AS slip_days,
             sh.exception_code, so.ship_state
      FROM shipments sh JOIN sales_orders so ON so.sales_order_id = sh.sales_order_id
      JOIN customers c ON c.customer_id = so.customer_id
      WHERE c.first_name = 'Ben' AND sh.promised_at LIKE '2026-02%'
        AND sh.delivered_at IS NOT NULL AND date(sh.delivered_at) > date(sh.promised_at)
      ORDER BY sh.promised_at
