    - sales_order_id: SO-08003
      promised_at: '2026-02-04'
      delivered_at: '2026-02-05'
      slip_days: 1
      exception_code: null
      ship_state: NY
    - sales_order_id: SO-08014
      promised_at: '2026-02-07'
      delivered_at: '2026-02-09'
      slip_days: 2
      exception_code: CARRIER_DELAY
      ship_state: NY
    - sales_order_id: SO-08019
      promised_at: '2026-02-07'
      delivered_at: '2026-02-08'
      slip_days: 1
      exception_code: null
