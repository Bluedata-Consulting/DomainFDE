- id: A13
  category: governed_metric
  tier: A
  q: Which wholesale accounts are at risk right now?
  expected_pass_from: V2
  why_rung: 'at_risk_account has three clauses over 90 days: (a) any escalated ticket, (b)
    two or more negative tickets, (c) a quality ticket AND a late delivery. The common-sense
    reading is "the one that escalated".'
  truth_sql: |
    WITH w AS (SELECT a.account_id, c.customer_id FROM wholesale_accounts a
               JOIN customers c ON c.account_id = a.account_id),
    tk AS (SELECT w.account_id, SUM(t.status = 'escalated') AS escalated,
                  SUM(t.sentiment = 'negative') AS negative, SUM(t.category = 'quality') AS quality
           FROM w JOIN tickets t ON t.customer_id = w.customer_id
            AND date(t.opened_at) >= date(:as_of, '-90 days') GROUP BY 1),
    lt AS (SELECT w.account_id, COUNT(*) AS late_deliveries FROM w
           JOIN sales_orders o ON o.customer_id = w.customer_id
            AND date(o.order_date) >= date(:as_of, '-90 days')
           JOIN shipments sh ON sh.sales_order_id = o.sales_order_id
           WHERE sh.delivered_at IS NOT NULL AND date(sh.delivered_at) > date(sh.promised_at)
           GROUP BY 1),
    m AS (SELECT a.account_id, a.account_name, a.tier,
                 COALESCE(escalated, 0) AS escalated, COALESCE(negative, 0) AS negative,
                 COALESCE(quality, 0) AS quality, COALESCE(late_deliveries, 0) AS late_deliveries
          FROM wholesale_accounts a LEFT JOIN tk USING (account_id) LEFT JOIN lt USING (account_id))
    SELECT account_name, tier, escalated, negative, quality, late_deliveries,
           TRIM((CASE WHEN escalated >= 1 THEN 'a ' ELSE '' END) ||
                (CASE WHEN negative >= 2 THEN 'b ' ELSE '' END) ||
                (CASE WHEN quality >= 1 AND late_deliveries >= 1 THEN 'c' ELSE '' END))
             AS clauses_fired
    FROM m
    WHERE escalated >= 1 OR negative >= 2 OR (quality >= 1 AND late_deliveries >= 1)
    ORDER BY account_id
  truth_shape: rows
  truth:
  - account_name: Rosewood Coffee House
    tier: flagship
    escalated: 1
    negative: 4
    quality: 4
    late_deliveries: 5
    clauses_fired: a b c
  - account_name: Ridgeline Hotel Group
    tier: flagship
    escalated: 0
    negative: 2
    quality: 2
    late_deliveries: 4
    clauses_fired: b c
  - account_name: Marlowe & Sons
    tier: standard
    escalated: 0
    negative: 1
    quality: 1
    late_deliveries: 10
    clauses_fired: c
  - account_name: Foundry Workspace
    tier: standard
    escalated: 0
    negative: 2
    quality: 2
    late_deliveries: 8
    clauses_fired: b c
  expect_all_from:
  - account_name
  naive:
  - label: only accounts with an escalated ticket
    sql: |
      SELECT DISTINCT a.account_name FROM tickets t
      JOIN customers c ON c.customer_id = t.customer_id
      JOIN wholesale_accounts a ON a.account_id = c.account_id
      WHERE t.status = 'escalated' AND date(t.opened_at) >= date(:as_of, '-90 days')
    shape: column
    value:
    - Rosewood Coffee House
  - label: counts inflated by the ticket x order x shipment join fan-out
    sql: |
      SELECT a.account_name,
             SUM(CASE WHEN t.status = 'escalated' THEN 1 ELSE 0 END) AS escalated_tickets,
             SUM(CASE WHEN t.sentiment = 'negative' THEN 1 ELSE 0 END) AS negative_tickets
      FROM wholesale_accounts a JOIN customers c ON c.account_id = a.account_id
      LEFT JOIN tickets t ON t.customer_id = c.customer_id
           AND date(t.opened_at) >= date(:as_of, '-90 days')
      LEFT JOIN sales_orders o ON o.customer_id = c.customer_id
           AND date(o.order_date) >= date(:as_of, '-90 days')
      LEFT JOIN shipments sh ON sh.sales_order_id = o.sales_order_id
      GROUP BY a.account_id, a.account_name
    shape: rows
    value:
    - account_name: Rosewood Coffee House
      escalated_tickets: 37
      negative_tickets: 148
    - account_name: Ridgeline Hotel Group
      escalated_tickets: 0
      negative_tickets: 82
    - account_name: Marlowe & Sons
      escalated_tickets: 0
      negative_tickets: 45
    - account_name: Pike Street Cafe
      escalated_tickets: 0
      negative_tickets: 0
    - account_name: Foundry Workspace
      escalated_tickets: 0
      negative_tickets: 92
    - account_name: Quayside Roasthouse
      escalated_tickets: 0
      negative_tickets: 0
  trap: 'Two failures to tell apart: naming only the escalated account, and quoting per-account
    ticket counts multiplied by the join fan-out (the second naive query reproduces the ontology''s
    own SQL, which lists the right accounts with the wrong counts).'
  check:
  - answer_contains_all
  - answer_excludes_naive
  failure_watch:
  - metric
  expect_all:
  - Rosewood Coffee House
  - Ridgeline Hotel Group
  - Marlowe & Sons
  - Foundry Workspace
